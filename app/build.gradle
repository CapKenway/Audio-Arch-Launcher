apply plugin: 'com.android.application'

def getGitHash = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        def hash = stdout.toString().trim()
        return hash.isEmpty() ? "unknown" : hash
    } catch (Exception e) {
        return "unknown"
    }
}

android {
    namespace 'com.audioarch.launcher'
    compileSdk 33

    defaultConfig {
        applicationId "com.audioarch.launcher"
        minSdk 14
        targetSdk 22
        versionCode 7
        def baseVer = "1.6"
        def gitHash = getGitHash()
        versionName "${baseVer} (${gitHash})"
        buildConfigField "String", "GIT_HASH", "\"${gitHash}\""
        buildConfigField "String", "BASE_VERSION", "\"${baseVer}\""
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.3.6'
    implementation 'androidx.viewpager:viewpager:1.0.0'
}
